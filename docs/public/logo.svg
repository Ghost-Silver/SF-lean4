<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background glow / gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="60" cy="60" r="48" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Outer Isometric Hexagon Prism (The Foundation) -->
  <g transform="translate(60, 60)">
    <!-- Top Face -->
    <path d="M 0,-44 L 38,-22 L 0,0 L -38,-22 Z" fill="#6366f1" opacity="0.95" />
    
    <!-- Left Face -->
    <path d="M -38,-22 L 0,0 L 0,44 L -38,22 Z" fill="#4338ca" opacity="0.95" />
    
    <!-- Right Face -->
    <path d="M 0,0 L 38,-22 L 38,22 L 0,44 Z" fill="#4f46e5" opacity="0.95" />

    <!-- Isometric Inner Layer Highlights -->
    <path d="M 0,-44 L 38,-22 L 0,0 L -38,-22 Z" fill="url(#prismGrad)" opacity="0.35" />
    <path d="M 0,0 L 38,-22 L 38,22 L 0,44 Z" fill="url(#accentGrad)" opacity="0.25" />

    <!-- Stylized Lambda / Logic Symbol on Top Face -->
    <g transform="translate(0, -22) scale(0.68)">
      <path d="M -16, 22 L 10, -22 C 12, -26 16, -26 18, -22 L 20, -18 C 22, -14 20, -10 16, -4 L 0, 22 Z" fill="#ffffff" opacity="0.95" />
      <path d="M -4, 0 L -18, 22 L -8, 22 L 4, 3 Z" fill="#38bdf8" opacity="0.95" />
    </g>

    <!-- Subtitle '4' and 'SF' Monogram Accent -->
    <circle cx="28" cy="24" r="9" fill="#0284c7" />
    <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">4</text>
  </g>
</svg>
